name: Publish Docker image

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vet, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
      - name: Vet root module
        run: go vet ./...
      - name: Build root module
        run: go build ./...
      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...
      - name: Test task plugin packages
        run: go test ./plugins/... ./pkg/jsplugin/... ./controller/... ./middleware/... ./router/...

  publish:
    name: Build and push (linux/amd64)
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Write VERSION
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="main-$(git rev-parse --short HEAD)"
          fi
          echo "$VERSION" > VERSION
          echo "Building VERSION=$VERSION"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/new-api
          tags: |
            type=raw,value=main,enable=${{ startsWith(github.ref, "refs/heads/") }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, "refs/heads/") }}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, "refs/tags/") }}
            type=sha,prefix=sha-
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Summary
        run: |
          echo "### Published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
